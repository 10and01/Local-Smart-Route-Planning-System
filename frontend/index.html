                        </div>
                        `;
                    }).join('')}
                </div>
                ` : ''}
            `;
            body.innerHTML = canvasHtml;

            // 绘制雷达图
            setTimeout(() => {
                const canvas = document.getElementById('radarCanvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                canvas.width = canvasSize * dpr;
                canvas.height = canvasSize * dpr;
                canvas.style.width = canvasSize + 'px';
                canvas.style.height = canvasSize + 'px';
                ctx.scale(dpr, dpr);
                ctx.clearRect(0, 0, canvasSize, canvasSize);

                // 绘制网格
                for (let r = 0.2; r <= 1; r += 0.2) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#e5e7eb';
                    ctx.lineWidth = 1;
                    for (let i = 0; i <= themeNames.length; i++) {
                        const angle = i * angleStep - Math.PI / 2;
                        const x = center + Math.cos(angle) * radius * r;
                        const y = center + Math.sin(angle) * radius * r;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }

                // 绘制轴线
                for (let i = 0; i < themeNames.length; i++) {
                    const angle = i * angleStep - Math.PI / 2;
                    const x = center + Math.cos(angle) * radius;
                    const y = center + Math.sin(angle) * radius;
                    ctx.beginPath();
                    ctx.strokeStyle = '#d1d5db';
                    ctx.moveTo(center, center);
                    ctx.lineTo(x, y);
                    ctx.stroke();

                    // 标签
                    const labelX = center + Math.cos(angle) * (radius + 20);
                    const labelY = center + Math.sin(angle) * (radius + 20);
                    ctx.fillStyle = '#374151';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(themeNames[i], labelX, labelY);
                }

                // 绘制数据区域
                ctx.beginPath();
                ctx.fillStyle = 'rgba(102, 126, 234, 0.25)';
                ctx.strokeStyle = 'rgba(102, 126, 234, 0.8)';
                ctx.lineWidth = 2;
                for (let i = 0; i <= themeNames.length; i++) {
                    const idx = i % themeNames.length;
                    const angle = idx * angleStep - Math.PI / 2;
                    const val = themeValues[idx] / maxVal;
                    const x = center + Math.cos(angle) * radius * val;
                    const y = center + Math.sin(angle) * radius * val;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 绘制数据点
                for (let i = 0; i < themeNames.length; i++) {
                    const angle = i * angleStep - Math.PI / 2;
                    const val = themeValues[i] / maxVal;
                    const x = center + Math.cos(angle) * radius * val;
                    const y = center + Math.sin(angle) * radius * val;
                    ctx.beginPath();
                    ctx.fillStyle = '#667eea';
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }, 50);
        }

        // ===== WGS-84 转 GCJ-02（火星坐标系）=====
        // 高德/腾讯等国内地图使用 GCJ-02，需将后端 WGS-84 坐标转换后渲染
        function wgs84_to_gcj02(lng, lat) {
            const pi = 3.14159265358979324;
            const a = 6378245.0;
            const ee = 0.00669342162296594323;
            function transformLat(lng, lat) {
                let ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
                ret += (20.0 * Math.sin(6.0 * lng * pi) + 20.0 * Math.sin(2.0 * lng * pi)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(lat * pi) + 40.0 * Math.sin(lat / 3.0 * pi)) * 2.0 / 3.0;
                ret += (160.0 * Math.sin(lat / 12.0 * pi) + 320 * Math.sin(lat * pi / 30.0)) * 2.0 / 3.0;
                return ret;
            }
            function transformLng(lng, lat) {
                let ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
                ret += (20.0 * Math.sin(6.0 * lng * pi) + 20.0 * Math.sin(2.0 * lng * pi)) * 2.0 / 3.0;
                ret += (20.0 * Math.sin(lng * pi) + 40.0 * Math.sin(lng / 3.0 * pi)) * 2.0 / 3.0;
                ret += (150.0 * Math.sin(lng / 12.0 * pi) + 300.0 * Math.sin(lng / 30.0 * pi)) * 2.0 / 3.0;
                return ret;
            }
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            let radLat = lat / 180.0 * pi;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            let sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
            return [lng + dLng, lat + dLat];
        }

        // ===== 地图初始化（含超时切换） =====
        // 杭州西湖中心 GCJ-02 坐标（对应 WGS-84 30.2596, 120.1460）
        const HZ_CENTER_GCJ = wgs84_to_gcj02(120.1460, 30.2596);
        const map = L.map('map', { zoomControl: false }).setView([HZ_CENTER_GCJ[1], HZ_CENTER_GCJ[0]], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let currentTileLayer = null;
        let tileFailed = false;

        // 国内 CDN 瓦片配置（高德）
        const AMAP_SUBDOMAINS = ['1', '2', '3', '4'];

        // 底图类型：vector=矢量, simple=简图, satellite=卫星
        let currentTileType = 'vector';
        const TILE_URLS = {
            vector: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
            simple: 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',
            satellite: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}'
        };

        function initTiles() {
            currentTileLayer = L.tileLayer(TILE_URLS.vector, {
                attribution: '&copy; 高德地图',
                maxZoom: 19,
                subdomains: AMAP_SUBDOMAINS,
                crossOrigin: true
            });
            currentTileLayer.addTo(map);
        }

        function switchTileLayer(type) {
            if (type === currentTileType) return;
            currentTileType = type;
            if (currentTileLayer) map.removeLayer(currentTileLayer);
            currentTileLayer = L.tileLayer(TILE_URLS[type], {
                attribution: '&copy; 高德地图',
                maxZoom: 19,
                subdomains: AMAP_SUBDOMAINS
            });
            currentTileLayer.addTo(map);
            // 更新按钮状态
            document.querySelectorAll('.tile-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
        }

        function ensureMapBackground() {
            const fallback = document.getElementById('mapFallback');
            // 检测tile加载情况
            let checkInterval = setInterval(() => {
                const tiles = document.querySelectorAll('.leaflet-tile');
                const loadedTiles = Array.from(tiles).filter(t => t.complete && t.naturalWidth > 0);
                if (tiles.length > 0 && loadedTiles.length > 0) {
                    fallback.classList.remove('show');
                    clearInterval(checkInterval);
                }
            }, 1000);
            // 6秒后如果仍无tile，显示fallback
            setTimeout(() => {
                const tiles = document.querySelectorAll('.leaflet-tile');
                const loadedTiles = Array.from(tiles).filter(t => t.complete && t.naturalWidth > 0);
                if (loadedTiles.length === 0) {
                    fallback.classList.add('show');
                }
                clearInterval(checkInterval);
            }, 6000);
        }

        initTiles();
        ensureMapBackground();

        let routeLayer = null;
        let arrowLayer = null;
        let markers = [];

        // ===== 城市数据初始化检查 =====
        async function ensureCityReady(city) {
            const progressDiv = document.getElementById('cityBuildProgress');
            const progressText = document.getElementById('cityBuildText');
            const progressBar = document.getElementById('cityBuildBar');
            
            // 先检查状态
            let statusResp = await apiCall(`/api/cities/${encodeURIComponent(city)}/status`);
            let statusData = await statusResp.json();
            
            // 如果已完全就绪，直接返回
            if (statusData.status === 'done') {
                progressDiv.style.display = 'none';
                hideLlmBanner();
                return true;
            }
            // fallback_ready：基础数据可用，但LLM仍在后台跑
            if (statusData.status === 'fallback_ready') {
                progressDiv.style.display = 'none';
                showLlmBanner(city);
                startBackgroundPoll(city);
                return true;
            }
            
            // 需要初始化
            progressDiv.style.display = 'block';
            progressText.textContent = `正在初始化「${city}」数据...`;
            progressBar.style.width = '5%';
            
            // 触发初始化
            await apiCall(`/api/cities/${encodeURIComponent(city)}/init`, {method: 'POST'});
            
            // 轮询状态：第一阶段高频轮询（高德拉取 + fallback，约20-30秒）
            for (let i = 0; i < 120; i++) {
                await new Promise(r => setTimeout(r, 1000));
                statusResp = await apiCall(`/api/cities/${encodeURIComponent(city)}/status`);
                statusData = await statusResp.json();
                
                progressBar.style.width = statusData.progress + '%';
                progressText.textContent = `「${city}」${statusData.message}`;
                
                if (statusData.status === 'done') {
                    progressDiv.style.display = 'none';
                    hideLlmBanner();
                    return true;
                }
                if (statusData.status === 'fallback_ready') {
                    progressDiv.style.display = 'none';
                    showLlmBanner(city);
                    startBackgroundPoll(city);
                    return true;
                }
                if (statusData.status === 'failed') {
                    progressText.textContent = `「${city}」初始化失败: ${statusData.message}`;
                    progressDiv.style.background = '#fef2f2';
                    progressDiv.style.borderColor = '#fecaca';
                    progressDiv.style.color = '#b91c1c';
                    return false;
                }
            }
            
            progressText.textContent = `「${city}」初始化超时，请稍后重试`;
            return false;
        }
        
        // ===== LLM 后台优化提示横幅 =====
        function showLlmBanner(city) {
            let banner = document.getElementById('llmBanner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'llmBanner';
                banner.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;background:#fff7ed;border:1px solid #fdba74;color:#c2410c;padding:8px 16px;border-radius:20px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);display:flex;align-items:center;gap:8px;';
                document.body.appendChild(banner);
            }
            banner.innerHTML = `<span class="llm-spinner" style="display:inline-block;width:12px;height:12px;border:2px solid #fdba74;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></span>「${city}」智能标注后台优化中，完成后路线推荐会更精准`;
            banner.style.display = 'flex';
        }
        function hideLlmBanner() {
            const banner = document.getElementById('llmBanner');
            if (banner) banner.style.display = 'none';
        }
        
        // 后台低频率轮询，直到 LLM 丰富化完成
        let _bgPollTimer = null;
        function startBackgroundPoll(city) {
            if (_bgPollTimer) clearInterval(_bgPollTimer);
            _bgPollTimer = setInterval(async () => {
                try {
                    const resp = await apiCall(`/api/cities/${encodeURIComponent(city)}/status`);
                    const data = await resp.json();
                    if (data.status === 'done') {
                        hideLlmBanner();
                        clearInterval(_bgPollTimer);
                        _bgPollTimer = null;
                        // 可选：刷新当前方案以使用LLM丰富化后的数据
                        // if (STATE.plans.length) generatePlan();
                    }
                } catch (e) {}
            }, 15000); // 每15秒检查一次
        }

        // ===== 生成路线 =====
        async function generatePlan() {
            const btn = document.getElementById('btnPlan');
            const loading = document.getElementById('loading');
            const errorBanner = document.getElementById('errorBanner');
            const prefDisplay = document.getElementById('prefDisplay');
            const viewNav = document.getElementById('viewNav');
            const formSection = document.getElementById('formSection');

            btn.disabled = true;
            btn.classList.add('loading');
            loading.classList.add('show');
            errorBanner.classList.remove('show');
            prefDisplay.style.display = 'none';
            viewNav.style.display = 'none';

            // 隐藏所有视图
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));

            // 5秒后换文案
            STATE.loadingTimer = setTimeout(() => {
                document.getElementById('loadingText').textContent = '还在规划中，请稍候...';
                document.getElementById('loadingSub').textContent = '多策略并行计算 · 强制差异化处理';
            }, 5000);

            const city = document.getElementById('city').value;
            if (!city) {
                showError('请选择或输入城市名称');
                btn.disabled = false;
                btn.classList.remove('loading');
                loading.classList.remove('show');
                return;
            }

            // 确保城市数据就绪
            const cityReady = await ensureCityReady(city);
            if (!cityReady) {
                showError(`「${city}」数据初始化失败，请稍后重试`);
                btn.disabled = false;
                btn.classList.remove('loading');
                loading.classList.remove('show');
                return;
            }

            // 更新地图中心到城市中心
            try {
                const cityResp = await apiCall(`/api/cities/${encodeURIComponent(city)}/status`);
                const cityData = await cityResp.json();
                if (cityData.center) {
                    // 城市中心已是GCJ-02，直接使用
                    map.setView([cityData.center.lat, cityData.center.lng], 12);
                }
            } catch (e) {
                console.error('更新地图中心失败', e);
            }

            const preferences = [];
            document.querySelectorAll('.tag-option.active').forEach(tag => {
                preferences.push(tag.dataset.tag);
            });
            
            // 【重构】合并自定义关键词（从chips和输入框读取）
            const chips = [...document.querySelectorAll('#keywordChips .custom-tag.active')].map(el => el.dataset.tag);
            const customInput = document.getElementById('customKeywords').value;
            const inputTags = customInput.split(/[,，\s]+/).filter(k => k.trim());
            const allPreferences = [...preferences, ...chips, ...inputTags];

            // 保存用户画像
            saveUserProfile();

            const requestBody = {
                raw_query: document.getElementById('rawQuery').value,
                city: document.getElementById('city').value,
                date: document.getElementById('date').value,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value,
                budget: document.getElementById('budget').value ? parseInt(document.getElementById('budget').value) : null,
                travelers: document.getElementById('travelers').value,
                preferences: allPreferences,
                pace: document.getElementById('pace').value,
                transport_mode: '步行'
            };

            try {
                const response = await apiCall('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (response.ok) {
                    STATE.plans = data.plans;
                    STATE.activePlanIndex = 0;
                    STATE.compareSelection.clear();
                    STATE.lastRequestId = data.request_id;
                    STATE.rankedCandidates = data.ranked_candidates || null;
                    displayResult(data);
                    showPlanOnMap(0);
                    // 加载天气
                    updateWeather(requestBody.city);
                    // 如果画像面板打开，自动刷新（显示最新更新）
                    const profilePanel = document.getElementById('profilePanel');
                    if (profilePanel && profilePanel.classList.contains('show')) {
                        loadUserProfileRadar();
                    }
                } else {
                    showError('规划失败: ' + (data.detail || '未知错误'));
                }
            } catch (err) {
                showError('请求失败，请确保后端服务已启动（python -m backend.main）');
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                loading.classList.remove('show');
                clearTimeout(STATE.loadingTimer);
                document.getElementById('loadingText').textContent = 'AI正在规划你的专属路线...';
                document.getElementById('loadingSub').textContent = '分析偏好标签 · 筛选候选POI';
            }
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorBanner').classList.add('show');
        }

        // ===== 分类工具函数 =====
        function getCategoryEmoji(category) {
            const map = {
                '风景名胜': '🏞️', '餐饮服务': '🍜', '咖啡厅': '☕',
                '购物服务': '🛍️', '博物馆': '🏛️', '休闲娱乐': '🎡',
                '文化': '📚', '公园': '🌳', '酒店': '🏨',
                '交通枢纽': '🚇', '医院': '🏥', '学校': '🎓'
            };
            return map[category] || '📍';
        }

        function renderStarRating(rating) {
            const full = Math.floor(rating);
            const half = rating - full >= 0.5 ? 1 : 0;
            const empty = 5 - full - half;
            let html = '<span class="star-rating">';
            for (let i = 0; i < full; i++) html += '<span class="star">★</span>';
            if (half) html += '<span class="star">☆</span>';
            for (let i = 0; i < empty; i++) html += '<span class="star empty">★</span>';
            html += '</span>';
            return html;
        }

        function getCategoryGradient(category) {
            const map = {
                '风景名胜': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                '餐饮服务': 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                '咖啡厅': 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                '购物服务': 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                '博物馆': 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                '休闲娱乐': 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)',
                '文化': 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)'
            };
            return map[category] || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
        }

        // ===== 展示结果总入口 =====
        function displayResult(data) {
            document.getElementById('prefDisplay').style.display = 'block';
            document.getElementById('viewNav').style.display = 'flex';

            const pref = data.user_preference;
            const themeEntries = Object.entries(pref.theme_weights || {})
                .sort((a, b) => b[1] - a[1]);
            const topThemes = themeEntries
                .slice(0, 5)
                .map(([k, v]) => `<span style="display:inline-block;padding:2px 8px;background:#e0e7ff;border-radius:10px;margin:2px;font-size:11px;">${k} ${Math.round(v*100)}%</span>`)
                .join('');
            document.getElementById('prefDisplay').innerHTML =
                `<strong>解析偏好：</strong>${topThemes || '综合'} <span style="color:#6b7280;font-size:12px;">· ${pref.traveler_type || '独自'} · ${pref.pace_preference || '适中'}</span>`;

            renderOverview();
            switchView('overview');
        }

        // ===== 视图切换 =====
        function switchView(viewName) {
            STATE.currentView = viewName;
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById('view' + viewName.charAt(0).toUpperCase() + viewName.slice(1)).classList.add('active');
            document.querySelectorAll('.view-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewName));

            // 对比视图隐藏compareBar，其他视图根据选择状态显示
            const compareBar = document.getElementById('compareBar');
            if (viewName === 'compare') {
                compareBar.classList.remove('show');
            } else {
                updateCompareBar();
            }

            if (viewName === 'detail') {
                renderDetail(STATE.activePlanIndex);
                showPlanOnMap(STATE.activePlanIndex);
            } else if (viewName === 'compare') {
                renderCompare();
            } else if (viewName === 'overview') {
                renderOverview();
                showPlanOnMap(STATE.activePlanIndex);
            }
        }

        function resetForm() {
            document.getElementById('prefDisplay').style.display = 'none';
            document.getElementById('viewNav').style.display = 'none';
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            STATE.plans = [];
            STATE.compareSelection.clear();
            clearMap();
        }

        // ===== 渲染三方案总览 =====
        function renderOverview() {
            const container = document.getElementById('viewOverview');
            if (!STATE.plans.length) { container.innerHTML = ''; return; }

            container.innerHTML = STATE.plans.map((plan, idx) => {
                const meta = STRATEGY_META[plan.theme] || STRATEGY_META['均衡推荐'];

                }, 0);

                return `
                <div class="plan-card-enhanced ${STATE.compareSelection.has(idx) ? 'selected' : ''}" data-idx="${idx}">

                        <div class="plan-card-desc">${plan.description}</div>

                                        <span style="position:absolute;z-index:2;pointer-events:none;">${getCategoryEmoji(s.poi.category)}</span>

                            `).join('')}
                            ${remaining > 0 ? `<div class="preview-more">+${remaining}</div>` : ''}
                        </div>
                        <div class="plan-card-footer">
                            <div class="plan-card-meta">
                                <span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                                    ${plan.poi_count}个地点
                                </span>
                                <span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>

                                </span>
                                <span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>

                                </span>

                            </div>
                            <div class="plan-card-actions" onclick="event.stopPropagation()">
                                <button class="card-action-btn" style="background:var(--color-primary);color:white;" onclick="trackPlanSelection(${idx});alert('已选择「${plan.theme}」方案，感谢您的反馈！')">
                                    ✓ 选这个
                                </button>
                                <button class="card-action-btn compare-check ${STATE.compareSelection.has(idx) ? 'checked' : ''}" onclick="toggleCompare(${idx})">

            }).join('');

            // 【新增】LLM 候选POI推荐面板
            if (STATE.rankedCandidates && STATE.rankedCandidates.length > 0) {
                const topCandidates = STATE.rankedCandidates.slice(0, 20);
                container.innerHTML += `
                <div class="candidate-panel">
                    <div class="candidate-panel-header" onclick="this.parentElement.classList.toggle('collapsed')">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span style="font-size:16px;">🎯</span>
                            <div>
                                <div style="font-weight:600;font-size:14px;">候选POI推荐（LLM排序）</div>
                                <div style="font-size:11px;color:#6b7280;">共 ${STATE.rankedCandidates.length} 个，点击可展开查看详情</div>

                                <div class="candidate-score">
                                    <div class="candidate-score-val" style="color:${c.match_score >= 80 ? '#10b981' : c.match_score >= 60 ? '#f59e0b' : '#9ca3af'}">${c.match_score}</div>

        function enterDetail(idx) {
            STATE.activePlanIndex = idx;
            document.getElementById('navDetail').disabled = false;
            switchView('detail');
            // 追踪用户选择行为
            trackPlanSelection(idx);
        }

        function toggleCompare(idx) {
            if (STATE.compareSelection.has(idx)) {
                STATE.compareSelection.delete(idx);
            } else {
                if (STATE.compareSelection.size >= 2) {
                    // 移除最早的一个
                    const first = STATE.compareSelection.values().next().value;
                    STATE.compareSelection.delete(first);
                }
                STATE.compareSelection.add(idx);
            }
            renderOverview();
        }

        function updateCompareBar() {
            const bar = document.getElementById('compareBar');
            const count = STATE.compareSelection.size;
            document.getElementById('compareCount').textContent = count;
            document.getElementById('btnGoCompare').disabled = count !== 2;
            bar.classList.toggle('show', count > 0);
        }

        function goCompare() {
            if (STATE.compareSelection.size === 2) {
                document.getElementById('navCompare').disabled = false;
                switchView('compare');
            }
        }

        // ===== 渲染单方案详情（时间轴） =====
        function renderDetail(planIndex) {
            const plan = STATE.plans[planIndex];
            if (!plan) return;
            const meta = STRATEGY_META[plan.theme] || STRATEGY_META['均衡推荐'];
            const container = document.getElementById('viewDetail');

            container.innerHTML = `
                <div class="detail-header">

                <div class="timeline">

                            </div>
                        </div>
                        ${idx < plan.segments.length - 1 ? `
                            <div class="timeline-transport">

                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 9l7-7 7 7"/><path d="M12 2v14"/><path d="M5 17h14"/></svg>

        // ===== POI详情面板 =====

        function closePoiPanel() {
            document.getElementById('poiPanel').classList.remove('show');
            document.getElementById('poiOverlay').classList.remove('show');
            STATE.currentPoi = null;

        // ===== 地图增强 =====
        function clearMap() {
            if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            if (arrowLayer) { map.removeLayer(arrowLayer); arrowLayer = null; }
            markers.forEach(m => map.removeLayer(m));
            markers = [];
        }

        function createNumberMarker(number, isEnd) {
            return L.divIcon({
                className: 'custom-marker-wrapper',
                html: `<div class="custom-marker ${isEnd ? 'end' : ''}">${number}</div>`,
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });
        }

        function showPlanOnMap(planIndex) {
            const plan = STATE.plans[planIndex];
            if (!plan || !plan.segments.length) return;

            clearMap();

            const points = plan.segments.map((seg, idx) => {
                // POI 数据来自高德 API，坐标已经是 GCJ-02，直接用于高德底图
                const lat = seg.poi.location.lat;
                const lng = seg.poi.location.lng;
                const isEnd = idx === plan.segments.length - 1;

                const marker = L.marker([lat, lng], { icon: createNumberMarker(idx + 1, isEnd) }).addTo(map);
                marker.on('click', () => openPoiPanel(planIndex, idx));
                markers.push(marker);

                return [lat, lng];
            });

            // 绘制实线带箭头
            routeLayer = L.polyline(points, {
                color: '#6366f1',
                weight: 4,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(map);

            // 添加方向箭头（使用小型三角形marker）
            if (points.length >= 2) {
                arrowLayer = L.layerGroup().addTo(map);
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const mid = [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
                    // 计算角度
                    const angle = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]) * 180 / Math.PI;
                    const arrowIcon = L.divIcon({
                        className: 'arrow-icon',
                        html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="#6366f1" style="transform: rotate(${angle + 90}deg);transform-origin:center;"><path d="M12 2L2 22h20L12 2z"/></svg>`,
                        iconSize: [12, 12],
                        iconAnchor: [6, 6]
                    });
                    arrowLayer.addLayer(L.marker(mid, { icon: arrowIcon, interactive: false }));
                }
            }

            map.fitBounds(routeLayer.getBounds(), { padding: [60, 60], maxZoom: 15 });
        }

        // ===== 渲染双方案对比 =====
        function renderCompare() {
            const container = document.getElementById('viewCompare');
            const indices = Array.from(STATE.compareSelection).sort((a, b) => a - b);
            if (indices.length !== 2) {
                container.innerHTML = '<div style="padding:40px;text-align:center;color:#9ca3af;font-size:13px;">请先选择两个方案进行对比</div>';
                return;
            }

            const planA = STATE.plans[indices[0]];
            const planB = STATE.plans[indices[1]];
            const metaA = STRATEGY_META[planA.theme] || STRATEGY_META['均衡推荐'];
            const metaB = STRATEGY_META[planB.theme] || STRATEGY_META['均衡推荐'];

            // 计算差异
            const distA = planA.segments.reduce((s, seg) => s + (seg.transport_distance_m || 0), 0);
            const distB = planB.segments.reduce((s, seg) => s + (seg.transport_distance_m || 0), 0);
            const diffDist = distB - distA;
            const diffCost = planB.total_cost - planA.total_cost;
            const diffCount = planB.poi_count - planA.poi_count;

            // 找出相同POI
            const namesA = new Set(planA.segments.map(s => s.poi.name));
            const namesB = new Set(planB.segments.map(s => s.poi.name));
            const commonNames = new Set([...namesA].filter(n => namesB.has(n)));

            container.innerHTML = `
                <div class="compare-summary">
                    <div class="compare-summary-item">
                        <span class="compare-summary-label">POI数量</span>
                        <span class="compare-summary-value">${planA.poi_count} vs ${planB.poi_count}</span>
                        <span class="compare-summary-diff ${diffCount > 0 ? 'diff-positive' : diffCount < 0 ? 'diff-negative' : ''}">${diffCount > 0 ? '+' : ''}${diffCount !== 0 ? diffCount : '相同'}</span>
                    </div>
                    <div class="compare-summary-item">
                        <span class="compare-summary-label">总花费</span>
                        <span class="compare-summary-value">¥${planA.total_cost} vs ¥${planB.total_cost}</span>
                        <span class="compare-summary-diff ${diffCost < 0 ? 'diff-positive' : diffCost > 0 ? 'diff-negative' : ''}">${diffCost > 0 ? '+' : ''}${diffCost !== 0 ? '¥' + Math.abs(diffCost) : '相同'}</span>
                    </div>
                    <div class="compare-summary-item">
                        <span class="compare-summary-label">总路程</span>
                        <span class="compare-summary-value">${(distA/1000).toFixed(1)}km vs ${(distB/1000).toFixed(1)}km</span>
                        <span class="compare-summary-diff ${Math.abs(diffDist) < 100 ? '' : diffDist > 0 ? 'diff-negative' : 'diff-positive'}">${diffDist > 0 ? '+' : ''}${Math.abs(diffDist) >= 100 ? (diffDist/1000).toFixed(1)+'km' : '相同'}</span>
                    </div>
                    <div class="compare-summary-item">
                        <span class="compare-summary-label">总用时</span>
                        <span class="compare-summary-value">${planA.total_time} vs ${planB.total_time}</span>
                    </div>
                    <div class="compare-summary-item">
                        <span class="compare-summary-label">相同POI</span>
                        <span class="compare-summary-value" style="color:var(--color-efficient);">${commonNames.size}个</span>
                    </div>
                </div>
                <div class="compare-columns">
                    <div class="compare-column">
                        <div class="compare-column-header ${metaA.key}">方案${String.fromCharCode(65+indices[0])}：${planA.theme}</div>
                        <div class="compare-timeline">
                            ${planA.segments.map((seg, idx) => {
                                const isCommon = commonNames.has(seg.poi.name);
                                return `
                                <div class="compare-node ${isCommon ? 'highlight' : ''}">
                                    <div class="compare-node-name">${idx+1}. ${seg.poi.name}</div>
                                    <div class="compare-node-time">${seg.arrive_time} - ${seg.leave_time} · ${seg.duration}分钟</div>
                                    ${isCommon ? '<div class="compare-node-match">两方案均包含</div>' : ''}
                                </div>
                                ${idx < planA.segments.length - 1 ? `
                                    <div style="font-size:10px;color:#9ca3af;padding:2px 0 8px 12px;">${seg.transport_to_next || ''}</div>
                                ` : ''}
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="compare-column">
                        <div class="compare-column-header ${metaB.key}">方案${String.fromCharCode(65+indices[1])}：${planB.theme}</div>
                        <div class="compare-timeline">
                            ${planB.segments.map((seg, idx) => {
                                const isCommon = commonNames.has(seg.poi.name);
                                return `
                                <div class="compare-node ${isCommon ? 'highlight' : ''}">
                                    <div class="compare-node-name">${idx+1}. ${seg.poi.name}</div>
                                    <div class="compare-node-time">${seg.arrive_time} - ${seg.leave_time} · ${seg.duration}分钟</div>
                                    ${isCommon ? '<div class="compare-node-match">两方案均包含</div>' : ''}
                                </div>
                                ${idx < planB.segments.length - 1 ? `
                                    <div style="font-size:10px;color:#9ca3af;padding:2px 0 8px 12px;">${seg.transport_to_next || ''}</div>
                                ` : ''}
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;

            // 在地图上同时显示两条路线（简化：只显示第一条）
            showPlanOnMap(indices[0]);
        }

        // ===== 响应式：地图折叠 =====
        function toggleMap() {
            const mapArea = document.getElementById('mapArea');
            const btn = document.getElementById('mapToggle');
            STATE.mapCollapsed = !STATE.mapCollapsed;
            mapArea.classList.toggle('collapsed', STATE.mapCollapsed);
            btn.textContent = STATE.mapCollapsed ? '展开地图' : '收起地图';
            setTimeout(() => map.invalidateSize(), 310);
        }

        // 监听窗口大小变化
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });

        // ===== 分享卡片生成（Canvas 9:16长图）=====
        async function generateShareCard(planIndex) {
            const plan = STATE.plans[planIndex];
            if (!plan) return;
            const meta = STRATEGY_META[plan.theme] || STRATEGY_META['均衡推荐'];
            const W = 600;
            const MAP_H = 300;
            const HEADER_H = 85;
            const ITEM_H = 120;
            const FOOTER_H = 90;
            const PAD = 24;
            // 动态高度：避免大量空白
            const H = HEADER_H + MAP_H + PAD + plan.segments.length * ITEM_H + PAD + FOOTER_H + 20;

            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // ========== 1. 背景 ==========
            const grd = ctx.createLinearGradient(0, 0, 0, H);
            grd.addColorStop(0, '#1a1a2e');
            grd.addColorStop(0.5, '#16213e');
            grd.addColorStop(1, '#0f3460');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, W, H);

            // ========== 2. 精美手绘路线图 ==========
            const mapY = HEADER_H;
            const validSegs = plan.segments.filter(s => s.poi.location);

            // 地图背景（深色 +  subtle grid）
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, mapY, W, MAP_H);

            // 绘制 subtle 网格线
            ctx.strokeStyle = 'rgba(100,116,139,0.08)';
            ctx.lineWidth = 1;
            for (let gx = 0; gx < W; gx += 40) {
                ctx.beginPath(); ctx.moveTo(gx, mapY); ctx.lineTo(gx, mapY + MAP_H); ctx.stroke();
            }
            for (let gy = mapY; gy < mapY + MAP_H; gy += 40) {
                ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
            }

            if (validSegs.length >= 1) {
                // 坐标转换：将经纬度映射到 canvas 区域
                const lats = validSegs.map(s => s.poi.location.lat);
                const lngs = validSegs.map(s => s.poi.location.lng);
                const minLat = Math.min(...lats), maxLat = Math.max(...lats);
                const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
                const latPad = (maxLat - minLat) * 0.3 || 0.02;
                const lngPad = (maxLng - minLng) * 0.3 || 0.02;
                const padMap = 50;
                const toX = (lng) => padMap + (lng - (minLng - lngPad)) / ((maxLng + lngPad) - (minLng - lngPad)) * (W - padMap * 2);
                const toY = (lat) => mapY + MAP_H - padMap - (lat - (minLat - latPad)) / ((maxLat + latPad) - (minLat - latPad)) * (MAP_H - padMap * 2);

                const nodeColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD'];
                const points = validSegs.map((seg, i) => ({
                    x: toX(seg.poi.location.lng),
                    y: toY(seg.poi.location.lat),
                    name: seg.poi.name,
                    label: String.fromCharCode(65 + i),
                    color: nodeColors[i % nodeColors.length]
                }));

                // 绘制发光路线（贝塞尔曲线连接）
                if (points.length >= 2) {
                    // 外发光
                    ctx.shadowColor = 'rgba(102,126,234,0.4)';
                    ctx.shadowBlur = 15;
                    ctx.strokeStyle = 'rgba(102,126,234,0.5)';
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.moveTo(points[0].x, points[0].y);
                    for (let i = 1; i < points.length; i++) {
                        const prev = points[i - 1];
                        const curr = points[i];
                        const cpX = (prev.x + curr.x) / 2 + (curr.y - prev.y) * 0.15;
                        const cpY = (prev.y + curr.y) / 2 - (curr.x - prev.x) * 0.15;
                        ctx.quadraticCurveTo(cpX, cpY, curr.x, curr.y);
                    }
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.shadowBlur = 0;

                    // 绘制中间小箭头（表示方向）
                    for (let i = 1; i < points.length; i++) {
                        const prev = points[i - 1];
                        const curr = points[i];
                        const midX = (prev.x + curr.x) / 2;
                        const midY = (prev.y + curr.y) / 2;
                        const angle = Math.atan2(curr.y - prev.y, curr.x - prev.x);
                        ctx.fillStyle = 'rgba(102,126,234,0.7)';
                        ctx.beginPath();
                        ctx.moveTo(midX + Math.cos(angle) * 6, midY + Math.sin(angle) * 6);
                        ctx.lineTo(midX + Math.cos(angle + 2.5) * 4, midY + Math.sin(angle + 2.5) * 4);
                        ctx.lineTo(midX + Math.cos(angle - 2.5) * 4, midY + Math.sin(angle - 2.5) * 4);
                        ctx.fill();
                    }
                }

                // 绘制节点（发光圆点 + 标签 + 名称）
                points.forEach((p, i) => {
                    // 外圈发光
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // 内圈白色
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
                    ctx.fill();

                    // 标签字母
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 13px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(p.label, p.x, p.y + 1);

                    // POI名称（节点上方或下方，避免重叠）
                    const nameY = i % 2 === 0 ? p.y - 28 : p.y + 36;
                    ctx.fillStyle = 'rgba(255,255,255,0.85)';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.name.length > 8 ? p.name.slice(0, 7) + '…' : p.name, p.x, nameY);
                });

                // 绘制装饰性"道路"（随机几条虚线，增加地图感）
                ctx.strokeStyle = 'rgba(148,163,184,0.06)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 8]);
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    const startY = mapY + 40 + i * 80;
                    ctx.moveTo(0, startY);
                    ctx.bezierCurveTo(W * 0.3, startY - 20, W * 0.7, startY + 20, W, startY);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            // 地图底部渐变遮罩（过渡到下方内容）
            const mapFadeBottom = ctx.createLinearGradient(0, mapY + MAP_H - 40, 0, mapY + MAP_H);
            mapFadeBottom.addColorStop(0, 'rgba(15,23,42,0)');
            mapFadeBottom.addColorStop(1, 'rgba(15,23,42,0.95)');
            ctx.fillStyle = mapFadeBottom;
            ctx.fillRect(0, mapY + MAP_H - 40, W, 40);

            // ========== 3. 标题区（覆盖在地图上方）==========
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`${plan.city || '杭州'}一日游`, PAD, 45);
            ctx.font = '14px sans-serif';
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.fillText(`方案${String.fromCharCode(65+planIndex)} · ${plan.theme}`, PAD, 68);

            // ========== 4. 预加载POI真实图片（通过后端代理绕过CORS）==========
            const imagePromises = plan.segments.map(async seg => {
                const url = seg.poi.photos && seg.poi.photos.length > 0 ? seg.poi.photos[0] : '';
                if (!url) return null;
                try {
                    const proxyResp = await apiCall(`/api/proxy-image?url=${encodeURIComponent(url)}`);
                    if (!proxyResp.ok) return null;
                    const proxyData = await proxyResp.json();
                    if (!proxyData.data) return null;
                    return await new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => resolve(img);
                        img.onerror = () => resolve(null);
                        img.src = proxyData.data;
                        setTimeout(() => resolve(null), 5000);
                    });
                } catch (e) {
                    return null;
                }
            });
            const images = await Promise.all(imagePromises);

            // ========== 5. POI时间轴列表 ==========
            let y = mapY + MAP_H + PAD;
            plan.segments.forEach((seg, idx) => {
                const img = images[idx];
                const imgSize = 90;
                const imgX = PAD;
                const imgY = y;

                // --- 左侧图片区 ---
                if (img) {
                    // 真实图片：圆角 + 阴影效果
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(imgX, imgY, imgSize, imgSize, 10);
                    ctx.clip();
                    ctx.drawImage(img, imgX, imgY, imgSize, imgSize);
                    ctx.restore();
                    // 图片边框
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(imgX, imgY, imgSize, imgSize, 10);
                    ctx.stroke();
                } else {
                    // Fallback：类别渐变色块 + 大emoji + 名称首字
                    const catGradients = {
                        '风景名胜': ['#1a5f3c', '#2d8a5e'],
                        '餐饮服务': ['#7c2d12', '#c2410c'],
                        '购物服务': ['#701a75', '#a21caf'],
                        '体育休闲服务': ['#1e3a8a', '#3b82f6'],
                    };
                    const gradColors = catGradients[seg.poi.category] || ['#334155', '#64748b'];
                    const fgrd = ctx.createLinearGradient(imgX, imgY, imgX + imgSize, imgY + imgSize);
                    fgrd.addColorStop(0, gradColors[0]);
                    fgrd.addColorStop(1, gradColors[1]);
                    ctx.fillStyle = fgrd;
                    ctx.beginPath();
                    ctx.roundRect(imgX, imgY, imgSize, imgSize, 10);
                    ctx.fill();
                    // emoji
                    ctx.font = '32px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(getCategoryEmoji(seg.poi.category), imgX + imgSize / 2, imgY + imgSize / 2 - 8);
                    // 首字
                    ctx.font = 'bold 14px sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.fillText(seg.poi.name.slice(0, 2), imgX + imgSize / 2, imgY + imgSize / 2 + 18);
                }

                // --- 节点标记（A/B/C... 叠加在图片右上角） ---
                const badgeSize = 22;
                const badgeX = imgX + imgSize - badgeSize + 4;
                const badgeY = imgY - 4;
                ctx.fillStyle = meta.color;
                ctx.beginPath();
                ctx.arc(badgeX + badgeSize/2, badgeY + badgeSize/2, badgeSize/2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String.fromCharCode(65 + idx), badgeX + badgeSize/2, badgeY + badgeSize/2 + 1);

                // --- 右侧文字区（与图片完全分离，不重叠） ---
                const textX = imgX + imgSize + 16;
                const textY = imgY + 6;

                // POI名称
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 17px sans-serif';
                ctx.fillText(seg.poi.name, textX, textY + 16);

                // 时间
                ctx.fillStyle = 'rgba(255,255,255,0.65)';
                ctx.font = '13px sans-serif';
                ctx.fillText(`${seg.arrive_time} - ${seg.leave_time} · ${seg.duration}分钟`, textX, textY + 38);

                // 类别标签 + 评分（同一行）
                let tagX = textX;
                const catText = seg.poi.category;
                ctx.font = '11px sans-serif';
                const catW = ctx.measureText(catText).width + 14;
                ctx.fillStyle = 'rgba(255,255,255,0.12)';
                ctx.beginPath();
                ctx.roundRect(tagX, textY + 50, catW, 20, 6);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.fillText(catText, tagX + 7, textY + 64);
                tagX += catW + 8;

                if (seg.poi.rating) {
                    const starText = `★ ${seg.poi.rating}`;
                    ctx.fillStyle = 'rgba(251,191,36,0.15)';
                    const starW = ctx.measureText(starText).width + 14;
                    ctx.beginPath();
                    ctx.roundRect(tagX, textY + 50, starW, 20, 6);
                    ctx.fill();
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillText(starText, tagX + 7, textY + 64);
                }

                // 价格
                if (seg.poi.price) {
                    ctx.fillStyle = 'rgba(255,255,255,0.45)';
                    ctx.font = '12px sans-serif';
                    ctx.fillText(`¥${seg.poi.price}/人`, textX, textY + 86);
                }

                y += ITEM_H;
            });

            // ========== 6. 底部统计 ==========
            const statsY = y + 10;
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(PAD, statsY);
            ctx.lineTo(W - PAD, statsY);
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(`${plan.poi_count}个地点 · ${plan.total_time} · ¥${plan.total_cost}`, W / 2, statsY + 35);

            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.font = '12px sans-serif';
            ctx.fillText('由 本地智能路线规划系统 生成', W / 2, statsY + 58);

            // ========== 7. 下载 ==========
            const link = document.createElement('a');
            link.download = `${plan.city || '杭州'}路线_${plan.theme}_${new Date().toISOString().slice(0,10)}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ESC关闭面板
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePoiPanel();
        });
    </script>
</body>
</html>
